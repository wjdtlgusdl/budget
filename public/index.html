<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>예산서 검토 · v50</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">Budget Review v50</p>
      <h1>예산서 검토용 값 추출 및 1차 검토</h1>
      <p>엑셀 또는 작성서식 PDF와 세출예산명세서 PDF를 비교해 급여·수당·퇴직적립금 편성 오류를 확인합니다.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card grid2">
      <label class="upload">예산서 작성서식(.xlsx/.xls/.pdf)
        <input id="excelFile" type="file" accept=".xlsx,.xls,.pdf" />
      </label>
      <label class="upload">PDF 세출예산명세서(.pdf)
        <input id="pdfFile" type="file" accept=".pdf" />
      </label>
      <div class="actions">
        <button id="runBtn">값 추출하기</button>
        <button id="downloadBtn" disabled>JSON 다운로드</button>
      </div>
    </section>

    <section id="status" class="status hidden"></section>

    <section class="card">
      <h2>1. 작성서식 파싱 결과</h2>
      <div id="excelSummary" class="muted">아직 실행하지 않았습니다.</div>
      <div id="excelTables"></div>
    </section>

    <section class="card">
      <h2>2. PDF 파싱 결과</h2>
      <div id="pdfSummary" class="muted">아직 실행하지 않았습니다.</div>
      <div id="pdfTables"></div>
    </section>

    <section class="card">
      <h2>3. 1차 검토 결과</h2>
      <p class="muted">수당은 개별편성·통합편성·오편성 가능성을 구분해 표시합니다. 작성서식 PDF는 텍스트형 PDF만 지원하며 스캔본은 인식이 제한됩니다.</p>
      <div id="precheck"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
